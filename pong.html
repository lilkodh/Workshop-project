<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="pong.css">
</head>
<body>
    <div class="container">
        <h1>PONG GAME</h1>
        <div class="scoreboard">
            <div class="score-section">
                <p class="label">Player</p>
                <p class="score" id="playerScore">0</p>
            </div>
            <div class="score-section">
                <p class="label">Computer</p>
                <p class="score" id="computerScore">0</p>
            </div>
        </div>
        
        <div class="game-info">
            <p>Use <strong>Mouse</strong> or <strong>Arrow Keys (↑/↓)</strong> to control the left paddle</p>
        </div>

        <canvas id="pongCanvas" width="800" height="400"></canvas>

        <div class="button-container">
            <button id="startBtn" class="btn">Start Game</button>
            <button id="resetBtn" class="btn">Reset</button>
        </div>

        <div class="game-status" id="gameStatus">Click "Start Game" to begin!</div>
    </div>

    <script src="pong.js"></script>
</body>
</html>
